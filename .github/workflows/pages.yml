# pages.yml - Build the SoftCalc web app and publish it on GitHub Pages
#
# https://tuinui98.github.io/SoftCalc/ (owner 2026-11-19). Runs when main
# changes something the web app is built from, or by hand (Actions > Run).
# Actions are pinned to the commit of a release, so a moved tag cannot
# change what runs here.

name: Web app on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/app/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/make_engine.py"
      - "engine/softcalc_engine/**"
      - "help/**"
      - "ui/SoftCalc/SoftCalc.csproj"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits rather than cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1        # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # make_engine.py compiles Python's library with the same 3.x as Pyodide's
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0      # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        working-directory: web
        run: npm ci
      - name: Prepare, test, build
        working-directory: web
        run: |
          npm run app:prepare
          npm test
          npx vite build app
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: web/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346    # v5.0.1
