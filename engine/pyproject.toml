# pyproject.toml - SoftCalc engine package definition

[project]
name = "softcalc-engine"
version = "1.0.0"
description = "Expression engine for SoftCalc (parsing, arbitrary precision maths, formatting)"
requires-python = ">=3.14"
dependencies = ["mpmath>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=9", "pyinstaller>=6.22"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["softcalc_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
