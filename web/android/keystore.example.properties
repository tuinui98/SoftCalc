# keystore.example.properties - Copy to keystore.local.properties (gitignored) for signed release builds.
# The keystore stays outside the repo; back up the .jks and these passwords: without them no update
# can be installed over an installed SoftCalc. Use forward slashes in the path.
storeFile=C:/Users/<you>/.softcalc/softcalc-release.jks
storePassword=<password>
keyAlias=softcalc
keyPassword=<password>
