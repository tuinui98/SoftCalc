<!doctype html>
<!-- index.html - SoftCalc web app -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#121316">
<meta name="description" content="SoftCalc: a precise calculator with History, units, dates and finance.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/softcalc-192.png">
<link rel="apple-touch-icon" href="./icons/softcalc-192.png">
<title>SoftCalc</title>
<!-- The start screen (owner 2026-11-19): the icon, name and version on the Android start
     screen's colour, with three dots, for at least SPLASH_MS (main.ts) while the engine loads.
     Plain HTML, so it shows before any script has loaded. The icon is at the middle of the
     screen at 132 px, where and as large as Android's own start screen draws it (the launcher
     icon's drawing is 60 of its 108 dp, shown at 240 dp), so the hand-over does not jump. -->
<style>
	html { background: #121316; }
	#splash
	{
		position: fixed; inset: 0; z-index: 100; background: #121316; color: #e8e8ea;
		font-family: system-ui, Roboto, sans-serif; text-align: center; transition: opacity 300ms ease-out;
	}
	#splash.gone { opacity: 0; pointer-events: none; }
	#splash img { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; transform: translate(-50%, -50%); }
	#splash .below { position: absolute; left: 0; right: 0; top: calc(50% + 66px + 20px); }
	#splash .name { font-size: 26px; font-weight: 500; letter-spacing: 0.5px; }
	#splash .version { margin-top: 4px; font-size: 14px; color: #8d8f96; }
	#splash .wait { margin-top: 26px; display: flex; gap: 8px; justify-content: center; }
	#splash .wait i { width: 8px; height: 8px; border-radius: 50%; background: #8d8f96; animation: splash-dot 1.2s ease-in-out infinite; }
	#splash .wait i:nth-child(2) { animation-delay: 0.2s; }
	#splash .wait i:nth-child(3) { animation-delay: 0.4s; }
	@keyframes splash-dot { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; } 40% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
	<img src="./icons/softcalc-192.png" alt="">
	<div class="below">
		<div class="name">SoftCalc</div>
		<div class="version">%SOFTCALC_VERSION%</div>
		<div class="wait"><i></i><i></i><i></i></div>
	</div>
</div>
<div id="app"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
